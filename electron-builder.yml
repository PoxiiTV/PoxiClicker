appId: com.poxi.poxiclicker
productName: PoxiClicker
copyright: Copyright © 2026 Poxi
directories:
  output: release
  buildResources: resources

# Solo lo necesario: el filtro evita que se cuele release/, docs o ficheros de desarrollo
files:
  - main.js
  - preload.js
  - src/**/*
  - resources/icon.png
  - package.json
  - '!**/*.map'

# El ayudante de clics es un .exe: no puede ejecutarse desde dentro del asar, va fuera
extraResources:
  - from: helper/clicker.exe
    to: clicker.exe

asar: true

win:
  icon: resources/icon.png
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  # Un clic: sin "siguiente, siguiente". Por usuario, así instalar y actualizar nunca pide administrador
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PoxiClicker
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages: [en_US, es_ES]

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

# Actualizaciones desde GitHub Releases (genera latest.yml + .blockmap)
publish:
  provider: github
  owner: PoxiiTV
  repo: PoxiClicker
